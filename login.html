<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acesso Administrativo — Escalas · Superlógica</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="auth-body">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-theme"><button id="themeToggle" class="btn-mini theme-toggle" type="button">🌙 Modo escuro</button></div>
        <div class="auth-logo">
          <div class="brand-badge">SL</div>
          <h1>Escalas · Superlógica</h1>
          <p>Acesso de administradores e analistas</p>
        </div>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="username">Usuário</label>
            <input type="text" id="username" name="username" autocomplete="username" placeholder="Digite seu usuário" minlength="3" maxlength="40" autocapitalize="none" spellcheck="false" required />
          </div>
          <div class="field">
            <label for="password">Senha</label>
            <div class="password-wrap">
              <input type="password" id="password" name="password" autocomplete="current-password" placeholder="6 dígitos" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required />
              <button type="button" id="togglePass" class="pass-toggle" aria-label="Mostrar senha">👁️</button>
            </div>
          </div>
          <div id="loginError" class="form-error hidden"></div>
          <p class="password-help">Acesso simples: seu usuário e uma senha numérica de 6 dígitos.</p>
          <button type="submit" id="loginBtn" class="btn-primary btn-block">
            Entrar no painel
          </button>
        </form>

        <p class="auth-hint">
          <a href="/">← Voltar para o mural público</a>
        </p>
      </div>
    </div>

    <script type="module" src="/src/login.ts"></script>
  </body>
</html>
